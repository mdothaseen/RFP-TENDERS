# Keyword rules used to classify every link / document that is found.
# Patterns are case-insensitive regular expressions matched against:
#   link text + surrounding text + file name (and the first pages of a document when read).
#
# Categories are checked in the order below; the first one that matches wins.
# So "Corrigendum to RFP ..." becomes Corrigendum, "EOI for empanelment ..." becomes EOI.

categories:
  Corrigendum:
    - corrigendum
    - addendum
    - 'extension of (the )?(last|due|submission|closing) date'
    - 'date (has been |is )?extended'
    - 'extended (till|upto|up to|to)'
    - 'pre[- ]?bid (query|queries|clarification|response|meeting)'
    - 'response to (pre[- ]?bid )?quer'
    - शुद्धिपत्र
  EOI:
    - '\beois?\b'
    - 'expressions? of interest'
    - 'expression[-_ ]of[-_ ]interest'
    - 'call for eoi'
    - अभिरुचि
  RFP:
    - '\brfps?\b'
    - '\brpfs?\b'
    - '\brfqs?\b'
    - '\brfe\b'
    - 'request[-_ ]for[-_ ](proposal|quotation|qualification|empanelment|information)'
    - '\bquotations?\b'
    - '\bgem\b.*\bbid\b'
  Tender:
    - '\btenders?\b'
    - 'e-?tender'
    - 'notice inviting tender'
    - '\bnit\b'
    - 'bid document'
    - 'invitation (for|to) bid'
    - '\bbids? (are|is) invited'
    - '\bbids?\b'
    - निविदा
  Empanelment:
    - '(?<!de-)(?<!de )(?<!de)empanelment'
    - '\bempanel\b'
    - 'invit\w*.{0,40}empanel'
    - 'onboarding of (assessment|training|aa|tp)'
    - 'selection of (an? )?(agency|agencies|partner|partners|vendor|vendors|firm|firms|training provider|training partner|consultant|organi[sz]ation)'
    - 'engagement of (an? )?(agency|agencies|firm|firms|vendor|vendors|partner|partners|organi[sz]ation)'
    - 'hiring of (an? )?(agency|agencies|firm|firms|vendor|consultancy)'
    - 'appointment of (an? )?(agency|agencies|firm|firms|auditor|ca firm|consultant)'
    - 'call for (proposals?|applications from (agencies|partners|organi[sz]ations|training))'
    - 'proposals? (are|is) invited'
    - 'invit(es|ing|ation of) (proposals?|applications from (agencies|training|organi[sz]ations|eligible))'
    - 'submission of proposals?'
    - 'seeking (an? )?(training|assessment|implementation|mobili[sz]ation|knowledge|technology|industry|placement) (partners?|agenc(y|ies)|providers?|organi[sz]ations?)'
    - 'invit(es|ing) (nominations|expressions?|applications|proposals)'
    - 'interested (training partners?|agencies|organi[sz]ations|parties|firms|vendors)'
    - '\bpias?\b'
    - 'accreditation of (training|assessment)'
  Recruitment:
    - vacanc
    - recruit
    - '\bcareers?\b'
    - '\bhiring\b'
    - '\bjobs?\b(?![\s_-]*roles?)'
    - 'walk[- ]?in'
    - 'engagement of (an? )?(professionals?|consultants?|experts?|trainers?|young professionals?|interns?)'
    - 'freelance'
    - 'internship'
    - 'position of'
    - 'call for (nominations?|experts?|resource persons?|mentors?)'
    - भर्ती
  Notice:
    - '\bnotices?\b'
    - circular
    - notification
    - advisory
    - '\border\b'
    - 'office memorandum'
    - blacklist
    - 'de-?empanel'
    - debar
    - caution
    - guideline
    - 'public info'
    - सूचना
    - अधिसूचना
    - परिपत्र
    - आदेश
  ToT-ToA/Result:
    - '\bresults?\b'
    - '\btot\b'
    - '\btoa\b'
    - '\btomt\b'
    - '\btoma\b'
    - '\bcalendar\b'
    - 'assessment (schedule|date)'
  News:
    - newsletter
    - '\bnews\b'
    - 'press release'
    - 'press coverage'
    - '\bevents?\b'
    - magazine
    - '\bblogs?\b'
    - webinar
    - conclave
    - 'in the news'

# Items matching these are stored but treated as "Other" (not shown in the main sheets).
# Checked before the categories above, but a tender-type match in the link text still wins.
other_patterns:
  - 'qualification[-_ ]pack'
  - '\bqps?\b'
  - '\bnos\b'
  - '[a-z]{3}[-_ /]?q\d{4}'
  - 'model[-_ ]curriculum'
  - brochure
  - 'hand[-_ ]?book'
  - 'participant[-_ ]handbook'
  - 'facilitator[-_ ]guide'
  - '\blogo\b'
  - 'privacy[-_ ]policy'
  - 'terms (of use|and conditions)'
  - 'question[-_ ]bank'
  - 'annual[-_ ]report'
  - 'membership[-_ ]form'
  - 'certificate[-_ ]download'
  - '\bgallery\b'
  # University / board pages: students' exams, not work for an agency.
  - 'date[-_ ]?sheets?'
  - 'admit[-_ ]?cards?|hall[-_ ]?tickets?'
  - 'syllabus|syllabi'
  - 'time[-_ ]?tables?'
  - 'convocation'
  - 'question[-_ ]papers?'
  - 'admissions?\b'
  - 'scholarships?'
  - '(exam|examination)[-_ ]?forms?'
  - 'semester|\bsem\b'
  - '\b[bmd]\.?\s?voc\b|\b[bm]\.?\s?tech\b|\bph\.?\s?d\b|\bdiploma\b|\bb\.?\s?sc\b|\bm\.?\s?sc\b|\bb\.?\s?com\b|\bmba\b|\bbba\b'
  - 'revised result|result of|results? (declared|for (the )?(odd|even|annual|supplementary))'

# Tender-type categories (used for the Tenders sheet, downloads and AI reading).
tender_categories: [Tender, RFP, EOI, Empanelment, Corrigendum]

# Words that make an item more relevant for the company profile (see settings.yaml).
relevance_high:
  - 'assessment agenc'
  - 'assessment bod'
  - '\baas?\b'
  - '\bpmkvy\b'
  - '\brpl\b'
  - 'recognition of prior learning'
  - 'assessor'
  - 'empanelment of assessment'
  - 'third.party assessment'
  - '\bcbt\b'
  - 'conduct(ing)? of (online |cbt )?exam'
  - 'proctor'
  - '\btpa\b'
  - 'third.party agenc'
  - 'certification (body|bodies|agenc)'
  # Training work is High too (training partners / providers, skill training programmes, ToT / ToA).
  - 'training (partner|provider|agenc|institut|organi[sz]ation|delivery|programme|program|project|centre|center)'
  - 'training of (candidates|beneficiaries|youth|trainees|trainers|women|students|workers)'
  - 'skill(ing)? (development|training|upgradation)'
  - 'skilling (programme|program|project|initiative)'
  - '\btot\b|\btoa\b|training of trainers|training of assessors'
  - '\bddu-?gky\b|\bpmkk\b|\bnaps\b|apprenticeship'
# Work close to assessment that the company could bid for (see company_profile in settings.yaml).
relevance_medium:
  - 'skill gap'
  - 'content (development|creation)'
  - 'question (bank|paper setting)'
  - 'third.party (monitoring|verification|evaluation)'
  - 'impact (assessment|evaluation|study)'
  - 'exam(ination)? (management|conduct|agency)'
  - 'evaluation of'
  - '\bsurvey\b'
  - 'baseline (study|survey)'
  - 'tracer study'
# Work the company does not do. A tender whose title only matches these is Low before Claude reads it.
relevance_low:
  - 'construct'
  - 'civil work'
  - 'repair'
  - 'renovat'
  - 'repaint|painting'
  - 'plumbing'
  - 'electri(cal|fication) work'
  - 'hostel'
  - 'canteen|\bmess\b|catering'
  - 'housekeeping|cleaning|sanitation|pest control'
  - 'security (services|guard|agency)'
  - 'manpower (supply|outsourc)'
  - 'annual maintenance|\bamc\b|o\s*&\s*m\b|operation (and|&) maintenance'
  - '(supply|purchase|procurement)\s+(of|and)'
  - '\bfurniture\b'
  - 'stationery'
  - 'printing'
  - 'laborator(y|ies)|lab equipment|chemicals'
  - '\bcomputers?\b|\blaptops?\b|\bprinters?\b|\bcctv\b|\bups\b|air.?condition|\bgenerator\b'
  - '\bvehicles?\b|\bcar\b|\btaxi\b|\bbus\b'
  - 'garden|horticulture'
  - 'sewage|\bstp\b|\blift\b|elevator'
  - 'paver|\broad\b|pavement|\bbuilding\b'
  - 'auction|disposal|\bscrap\b'
  - 'insurance|travel agenc|\bhotel\b'
  - 'event management'
  - 'mobili[sz]ation|placement agenc'
  - 'chartered accountant|\bca firm|internal audit|statutory audit'

# Link texts that are parts of a tender listed next to it ("Price Bid", "Declaration GST", "Annexure-II").
# They are kept as "Other" so one tender does not show up as eight. Matched against the whole link text.
attachment_titles:
  - '^(price|financial|technical|commercial)\s+(bid|proposal)s?(\s+(format|form|document|sheet))?\.?$'
  - '^declarations?\b.{0,40}$'
  - '^(technical\s+)?specifica\w*(\s+sheet)?\.?$'
  - '^(general\s+)?terms\s+(and|&)\s+conditions\b.{0,40}$'
  - '^(annexure|annex|appendix|schedule|format|proforma|form)[\s\-–:]*[\w\d]{0,6}\.?$'
  - '^(boq|bill of quantit(y|ies)|price schedule|undertaking|affidavit|bank (details|mandate)|mandate form|check\s?list|integrity pact)\b.{0,30}$'

# Link texts that say nothing about the document; such documents are opened and read to classify them.
vague_titles:
  - '^(click here|click|here|download|download here|download pdf|view|view more|view details|read more|more|details|pdf|open|link|notice|public notice|important notice|document|file|new|latest|attachment)$'
  - '^(apply|apply now|apply here|click to apply|register|register now|submit|submit now|fill (the )?form|form|form link|google form|know more|learn more)$'
  - '^[\W\d_]*$'

# Phrases that, when found inside a document, mark it as tender-type.
content_phrases:
  EOI: ['expression of interest', 'expressions of interest']
  RFP: ['request for proposal', 'request for quotation', 'technical bid', 'financial bid', 'technical proposal', 'financial proposal']
  Tender: ['tender document', 'notice inviting tender', 'earnest money deposit', 'bid security', 'bid submission', 'tender fee']
  Empanelment: ['empanelment of', 'applications are invited from', 'proposals are invited', 'last date (of|for) submission of (proposal|application|bid)']
  Corrigendum: ['corrigendum', 'addendum', 'extension of last date', 'last date has been extended']

# URL parts the crawler never follows.
crawl_exclude:
  # Hindi versions of bilingual sites: the English pages carry the same notices.
  - '/hi/'
  - '/hindi/'
  - '[?&]lang(uage)?=(hi|hin)'
  # Student pages of universities and boards (results, timetables, admissions): thousands of files, no tenders.
  - '/(admissions?|syllabus|date-?sheets?|admit-?cards?|time-?tables?|convocation|alumni|faculty|departments?|photo-?gallery|gallery|question-?papers?|scholarships?)(/|\.|$|\?)'
  - '/wp-admin'
  - '/wp-login'
  - 'xmlrpc.php'
  - '/feed/?$'
  - '/comments/feed'
  - '/wp-json/oembed'
  - 'replytocom='
  - '/tag/'
  - '/author/'
  - 'login'
  - 'logout'
  - 'signin'
  - 'sign-in'
  - 'register'
  - '/cart'
  - '/checkout'
  - 'javascript:'
  - 'mailto:'
  - 'tel:'
  - 'whatsapp:'
  - '\.(jpe?g|png|gif|svg|webp|bmp|ico|mp4|mp3|avi|mov|wmv|css|js|woff2?|ttf|eot|map)(\?|$)'

# Crawl these links earlier (priority queue).
crawl_priority:
  - 'tender|rfp|rfq|eoi|expression|empanel|procure|quotation|corrigend|bid'
  - 'notice|circular|notification|announce|update|latest|what.?s.new|order'
  - 'career|vacanc|recruit|job|advertis'
  - 'news|press|download|resource|media|event'

# External hosts whose links are recorded (never crawled) when they look relevant.
external_doc_hosts:
  - drive.google.com
  - docs.google.com
  - forms.gle
  - forms.office.com
  - gem.gov.in
  - bidplus.gem.gov.in
  - eprocure.gov.in
  - zfrmz.in
  - zoom.us
