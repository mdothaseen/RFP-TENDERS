# Websites checked every day.
#
# code         short id (used for folder names and in Excel)
# name         full organisation name
# url          homepage that the crawl starts from
# seeds        pages crawled first on every run (tender / notice / career pages found during research).
#              They are only hints: every run still crawls the site, reads sitemaps and the WordPress API.
# js           true = site is built with JavaScript, pages are rendered in headless Chromium
# ssl_verify   false = site has a broken HTTPS certificate
# extra_hosts  other hostnames whose documents belong to this site
# exclude      URL substrings the crawler should skip
# tier         Focused / Regular / Low: order and amount of detail in the summary email (all sites are scanned)
# nic_orgs     state e-procurement portal (NIC GePNIC): read only the departments whose names match these
#              patterns ("default" = the list below). The portal itself is never crawled.
#
# To add a new organisation, copy one block and change the values.

# Departments read on every e-procurement portal (nic_orgs: default). Road and building works are left out.
nic_orgs_default:
  - 'skill|kaushal'
  - '\blabou?r\b'
  - 'employment'
  - 'technical education'
  - 'vocational'
  - 'livelihood'
  - '\bITI\b|industrial training'
  - 'apprentice'
  - 'entrepreneur'

