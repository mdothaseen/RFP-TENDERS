    url: https://dcmsme.gov.in/
    # Staff-only pages (office / transfer / budget orders, seniority lists): over 1000 files, never tenders.
    exclude: ["/employ-corner/", "Office_Order", "Budget_Allocation", "Transfer_order", "MISC_Order",
