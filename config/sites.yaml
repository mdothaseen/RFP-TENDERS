    notes: The bare domain redirects to the Hindi site (/hi/); English pages are used instead.

  # msme.gov.in blocks automated browsers (403), so the tenders of the Ministry's
  # Development Commissioner office (dcmsme.gov.in, plain HTML) are read instead.
  - code: MM
    name: "Office of the Development Commissioner, Ministry of MSME (DC-MSME)"
    url: https://dcmsme.gov.in/
    # Staff-only pages (office / transfer / budget orders, seniority lists): over 1000 files, never tenders.
    exclude: ["/employ-corner/", "Office_Order", "Budget_Allocation", "Transfer_order", "MISC_Order",
              "/IEDS", "Seniority_List", "Recruitment_rules", "compassionate_appointment", "Sanction_Order",
              "RTI_Disclosure", "OM_Instructions", "/old/"]
    seeds:
      - https://dcmsme.gov.in/Tender.aspx
      - https://dcmsme.gov.in/Notice_Board.aspx
      - https://dcmsme.gov.in/Advertisements.aspx

